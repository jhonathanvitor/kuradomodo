services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: kuradomodo-app
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
        ports:
            - "80:80"
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
        networks:
            - kuradomodo

    node:
        image: node:20-alpine
        container_name: kuradomodo-node
        working_dir: /var/www/html
        environment:
            CHOKIDAR_USEPOLLING: "true"
            VITE_HMR_HOST: localhost
        command: >
            sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci; fi
            && npm run dev -- --host 0.0.0.0 --port 5173"
        ports:
            - "5173:5173"
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        depends_on:
            - app
        networks:
            - kuradomodo

    mysql:
        image: mysql:8.0
        container_name: kuradomodo-mysql
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${DB_ROOT_PASSWORD} --silent"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./looganco_kuradomodo.sql:/docker-entrypoint-initdb.d/01-kuradomodo.sql:ro
        networks:
            - kuradomodo

networks:
    kuradomodo:

volumes:
    mysql_data:
    node_modules:
    vendor:
